plugins {
    id 'fabric-loom' version "${fabric_loom_version}"
}

// Gametest delegators live here, not main: shipping them in the release fabric.mod.json broke
// consumers, since the shared *Scenarios bodies they call are deliberately not in the jar.
sourceSets {
    gametest {
        compileClasspath += sourceSets.main.compileClasspath
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.runtimeClasspath
        runtimeClasspath += sourceSets.main.output
    }
    // The screenshot driver, for the same reason: only the uiShots run puts it on the classpath.
    uishots {
        compileClasspath += sourceSets.main.compileClasspath
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.runtimeClasspath
        runtimeClasspath += sourceSets.main.output
    }
}

def uiShotsOutput = rootProject.file('build/uishots/fabric')

repositories {
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"

    // Plain implementation, not modImplementation: keeps Loom from remapping common's classes.
    implementation project(':common')

    gametestImplementation project(':common').sourceSets.gametest.output
    uishotsImplementation project(':common').sourceSets.uishots.output

    // Optional: Mod Menu's mod list opens the rules screen when it is installed. Compiled against
    // only; modLocalRuntime puts it in dev runs (a client-only mod, so server runs skip it) and
    // keeps it out of the jar and the published metadata.
    modCompileOnly "maven.modrinth:modmenu:${modmenu_modrinth_id}"
    modLocalRuntime "maven.modrinth:modmenu:${modmenu_modrinth_id}"
}

loom {
    runs {
        server {
            server()
            ideConfigGenerated = true
        }
        client {
            client()
        }
        gametest {
            server()
            name = 'Game Test'
            source sourceSets.gametest
            property 'fabric-api.gametest'
            property 'fabric-api.gametest.report-file', "${project.buildDir}/junit.xml"
            ideConfigGenerated = true
        }
        // Screenshots of the rules screen at fixed 1920x1080, into build/uishots/fabric.
        uiShots {
            client()
            name = 'UI Shots'
            runDir = 'run-uishots'
            source sourceSets.uishots
            programArgs '--username', 'Dev1', '--width', '1920', '--height', '1080'
            property 'critfall.uishots.dir', uiShotsOutput.absolutePath
        }
    }
}

// No stale screenshots on every run.
def wipeUiShots = tasks.register('wipeUiShots', Delete) {
    delete uiShotsOutput
}
tasks.matching { it.name == 'runUiShots' }.configureEach { dependsOn wipeUiShots }

// Nothing in the build graph compiles the uishots source set otherwise; keep `check` catching it.
tasks.named('check') { dependsOn tasks.named('uishotsClasses') }

jar {
    from project(':common').sourceSets.main.output.classesDirs
}

processResources {
    from project(':common').sourceSets.main.resources

    def props = [
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_version            : mod_version,
            mod_description        : mod_description,
            mod_license            : mod_license,
            mod_issue_tracker      : mod_issue_tracker,
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            fabric_loader_version  : fabric_loader_version,
    ]
    inputs.properties props
    filesMatching(['fabric.mod.json', 'pack.mcmeta']) {
        expand props
    }
}
